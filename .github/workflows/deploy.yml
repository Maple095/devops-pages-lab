name: Deploy GitHub Pages with Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 階段 1：前置驗證閘門 (Gated Validation)
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required activity markers in README
        run: |
          echo "正在驗證 README.md 是否包含必要標籤..."
          if ! grep -q "<!--START_SECTION:activity-->" README.md; then
            echo "::error::缺少 <!--START_SECTION:activity--> 標記！阻斷發布！"
            exit 1
          fi
          if ! grep -q "<!--END_SECTION:activity-->" README.md; then
            echo "::error::缺少 <!--END_SECTION:activity--> 標記！阻斷發布！"
            exit 1
          fi
          echo "驗證通過：標籤完整存在。"

  # 階段 2：正式部署（必須等到 validate 成功才執行）
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
